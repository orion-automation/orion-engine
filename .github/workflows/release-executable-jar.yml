name: Release JAR on Tag

on:
  release:
    types: [created]  # Triggers when a new release is created

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # Use another JDK if needed
          java-version: '17'       # Adjust based on your project

      - name: Update version in pom.xml (Release only)
        run: mvn -B versions:set -DnewVersion=${{ github.event.release.tag_name }} -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn clean package  # Change to Gradle if needed

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git commit -am "[skip ci] chore: update pom version to ${{ github.event.release.tag_name }}"
          git push origin HEAD:main

  notify-on-failure:
    needs: build
    if: failure()
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - if: failure()
        name: 'Create failed issue'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPE: Deploy
          RUN-ID: ${{ github.run_id }}
          JOB-ID: ${{ github.job }}
          REF: ${{ github.ref }}
          REF-NAME: ${{ github.ref_name }}